name: Mise à jour des données

on:
  schedule:
    # Chaque lundi à 21:17 UTC, après les publications f1db du dimanche soir et du lundi
    - cron: "17 21 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # Met à jour f1db puis régénère tous les classements
      # (historique, qualifications, sprint, 2e pilote, ELO, champions)
      - name: Régénérer les classements
        run: bash src/scripts/updatedata.sh

      - name: Ouvrir une pull request s'il y a du nouveau
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/data-update
          commit-message: "Mise à jour automatique des classements"
          title: "Mise à jour automatique des classements"
          body: |
            Classements régénérés depuis la dernière version de f1db
            (historique, qualifications, sprint, 2e pilote, ELO, champions).
          add-paths: |
            docs/data
            data/f1db
          delete-branch: true
